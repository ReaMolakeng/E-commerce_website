<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product | Agrisudeco Poultry</title>

    <link rel="stylesheet" href="css/admin-style.css">
</head>

<body>

    <!-- ADMIN SIDEBAR -->
    <aside class="admin-sidebar" id="admin-sidebar">

        <div class="admin-sidebar-header">
            <img src="../images/agrisudeco-logo.png"
                 alt="Agrisudeco Poultry Logo">

            <h2>Agrisudeco</h2>
        </div>

        <nav class="admin-nav">

            <a href="dashboard.html" class="admin-nav-link">
                <span>📊</span>
                Dashboard
            </a>

            <a href="products.html" class="admin-nav-link active">
                <span>📦</span>
                Products
            </a>

            <a href="orders.html" class="admin-nav-link">
                <span>🛒</span>
                Orders
            </a>

            <a href="customers.html" class="admin-nav-link">
                <span>👥</span>
                Customers
            </a>

            <a href="../index.html" class="admin-nav-link">
                <span>🏪</span>
                View Store
            </a>

            <a href="#" class="admin-nav-link" id="admin-logout">
                <span>🚪</span>
                Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="admin-main">

        <!-- TOP BAR -->
        <header class="admin-topbar">

            <button class="admin-menu-toggle" id="admin-menu-toggle">
                ☰
            </button>

            <div>
                <h1>Edit Product</h1>
                <p>Update product information</p>
            </div>

            <div class="admin-user">
                <span>Administrator</span>
            </div>

        </header>


        <!-- PAGE CONTENT -->
        <section class="admin-content">

            <div class="admin-form-section">

                <div class="form-section-header">
                    <h2>Edit Product</h2>

                    <p>
                        Update the information for this product below.
                    </p>
                </div>


                <!-- EDIT PRODUCT FORM -->
                <form id="edit-product-form">

                    <!-- PRODUCT NAME -->
                    <div class="admin-form-group">

                        <label for="edit-product-name">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="edit-product-name"
                            placeholder="Enter product name"
                            required
                        >

                    </div>


                    <!-- CATEGORY + PRICE -->
                    <div class="admin-form-row">

                        <div class="admin-form-group">

                            <label for="edit-product-category">
                                Category
                            </label>

                            <select
                                id="edit-product-category"
                                required
                            >

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Chicken">
                                    Chicken
                                </option>

                                <option value="Eggs">
                                    Eggs
                                </option>

                                <option value="Bulk">
                                    Bulk Orders
                                </option>

                            </select>

                        </div>


                        <div class="admin-form-group">

                            <label for="edit-product-price">
                                Price (R)
                            </label>

                            <input
                                type="number"
                                id="edit-product-price"
                                placeholder="0.00"
                                min="0"
                                step="0.01"
                                required
                            >
                        </div>
                    </div>

                    <!-- STOCK -->
                    <div class="admin-form-group">

                        <label for="edit-product-stock">
                            Stock Quantity
                        </label>

                        <input
                            type="number"
                            id="edit-product-stock"
                            placeholder="Enter stock quantity"
                            min="0"
                            required
                        >
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="admin-form-group">

                        <label for="edit-product-description">
                            Product Description
                        </label>

                        <textarea
                            id="edit-product-description"
                            rows="6"
                            placeholder="Enter product description"
                            required
                        ></textarea>

                    </div>


                    <!-- PRODUCT IMAGE -->
                    <div class="admin-form-group">

                        <label for="edit-product-image">
                            Product Image
                        </label>

                        <input
                            type="file"
                            id="edit-product-image"
                            accept="image/*"
                        >

                        <small>
                            Leave this empty if you do not want to change
                            the product image.
                        </small>

                    </div>


                    <!-- IMAGE PREVIEW -->
                    <div
                        class="product-image-preview"
                        id="edit-product-image-preview"
                    >

                        <span>
                            Current Product Image
                        </span>

                    </div>


                    <!-- FORM BUTTONS -->
                    <div class="admin-form-actions">

                        <a
                            href="products.html"
                            class="cancel-product-btn"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="save-product-btn"
                        >
                            Update Product
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <!-- ADMIN JAVASCRIPT -->
    <script src="js/admin.js"></script>

</body>
</html>
